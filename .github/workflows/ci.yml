name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The packaging tests read the kits from test-results/ (see docs/PACKAGING.md).
      - run: node scripts/packaging/package-kit.mjs --output test-results/local-kit
      - run: node scripts/packaging/docker/package-docker.mjs --output test-results/docker-kit
      - run: node --test tests/packaging/*.test.mjs
