# ReviewDesk — auto-hébergement Docker Compose.
# Lancez d'abord `sh install.sh` : il crée .env, secrets/ (droits 600) et, pour le
# stockage S3 intégré (défaut), l'autorité et le certificat TLS internes certs/.
# PostgreSQL et le S3 intégré ne sont publiés sur aucun port ; l'application
# écoute uniquement sur 127.0.0.1 et doit être exposée par un reverse proxy HTTPS
# sur la même machine.
# Stockage intégré : services s3-storage, s3 et s3-init, activés par
# COMPOSE_PROFILES=bundled-s3 dans .env. S3 externe : COMPOSE_PROFILES absent,
# seuls postgres et app tournent.
name: reviewdesk

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: reviewdesk
      POSTGRES_DB: reviewdesk
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "reviewdesk", "-d", "reviewdesk"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Bundled S3: SeaweedFS (weed 4.48), pinned by digest. No network interface
  # at all (network_mode: none): master, volume, filer, the S3 gateway and its
  # gRPC port only exist on the container loopback. The S3 API leaves the
  # container through the Unix socket of the s3socket volume, served by `s3`.
  s3-storage:
    profiles: [bundled-s3]
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/reviewdesk/s3/entrypoint.sh"]
    environment:
      S3_BUCKET: "${S3_BUCKET:?S3_BUCKET manquant dans .env}"
    secrets:
      - s3_access_key_id
      - s3_secret_access_key
      - s3_admin_access_key_id
      - s3_admin_secret_access_key
      - s3_tls_key
    volumes:
      - s3data:/data
      - s3socket:/run/reviewdesk-s3
      - ./s3/entrypoint.sh:/etc/reviewdesk/s3/entrypoint.sh:ro
      - ./certs:/etc/reviewdesk/certs:ro
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # Read the secret files, then drop to the `seaweed` user (su-exec).
    cap_add:
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--cacert", "/etc/reviewdesk/certs/ca.pem", "--resolve", "s3:8444:127.0.0.1", "https://s3:8444/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Bundled S3: https://s3:8443 on the internal network. Terminates TLS with the
  # certificate generated by install.sh for `s3` and forwards to the SeaweedFS
  # Unix socket (app/s3-gateway.mjs). Holds the TLS key only, no S3 identity.
  s3:
    profiles: [bundled-s3]
    build:
      context: ./app
    command: ["node", "/app/s3-gateway.mjs"]
    restart: unless-stopped
    depends_on:
      s3-storage:
        condition: service_healthy
    environment:
      NODE_ENV: production
    secrets:
      - s3_tls_key
    volumes:
      - s3socket:/run/reviewdesk-s3
      - ./certs:/etc/reviewdesk/certs:ro
    networks:
      - backend
    read_only: true
    cap_drop:
      - ALL
    # Read the root-owned TLS key, then drop to the `node` user.
    cap_add:
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "/app/s3-gateway.mjs", "--check"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Bundled S3: creates the private bucket if missing (idempotent), then exits.
  s3-init:
    profiles: [bundled-s3]
    build:
      context: ./app
    command: ["node", "/app/s3-bootstrap.mjs"]
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    environment:
      NODE_ENV: production
      S3_ENDPOINT: "${S3_ENDPOINT:?S3_ENDPOINT manquant dans .env}"
      S3_BUCKET: "${S3_BUCKET:?S3_BUCKET manquant dans .env}"
      S3_REGION: "${S3_REGION:?S3_REGION manquant dans .env}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:?S3_FORCE_PATH_STYLE manquant dans .env}"
      S3_KEY_PREFIX: "${S3_KEY_PREFIX:-uploads}"
      NODE_EXTRA_CA_CERTS: "${NODE_EXTRA_CA_CERTS:-}"
    secrets:
      - s3_admin_access_key_id
      - s3_admin_secret_access_key
    volumes:
      - ./certs:/etc/reviewdesk/certs:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  app:
    build:
      context: ./app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
        required: false
    environment:
      REVIEWDESK_CONFIGURED: "${REVIEWDESK_CONFIGURED:?Configuration absente : lancez sh install.sh}"
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4300"
      SECURE_COOKIES: "true"
      STORAGE_DRIVER: s3
      DATABASE_POOL_MAX: "10"
      S3_ENDPOINT: "${S3_ENDPOINT:?S3_ENDPOINT manquant dans .env (https://hôte requis)}"
      S3_BUCKET: "${S3_BUCKET:?S3_BUCKET manquant dans .env}"
      S3_REGION: "${S3_REGION:?S3_REGION manquant dans .env}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:?S3_FORCE_PATH_STYLE manquant dans .env}"
      S3_KEY_PREFIX: "${S3_KEY_PREFIX:-uploads}"
      NODE_EXTRA_CA_CERTS: "${NODE_EXTRA_CA_CERTS:-}"
    secrets:
      - admin_password
      - postgres_password
      - s3_access_key_id
      - s3_secret_access_key
    volumes:
      - ./certs:/etc/reviewdesk/certs:ro
    ports:
      - "127.0.0.1:${REVIEWDESK_HTTP_PORT:?REVIEWDESK_HTTP_PORT manquant dans .env}:4300"
    networks:
      - backend
      - egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # Read the root-owned secret files, then drop to the `node` user.
    cap_add:
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

secrets:
  admin_password:
    file: ./secrets/admin_password
  postgres_password:
    file: ./secrets/postgres_password
  s3_access_key_id:
    file: ./secrets/s3_access_key_id
  s3_secret_access_key:
    file: ./secrets/s3_secret_access_key
  s3_admin_access_key_id:
    file: ./secrets/s3_admin_access_key_id
  s3_admin_secret_access_key:
    file: ./secrets/s3_admin_secret_access_key
  s3_tls_key:
    file: ./secrets/s3_tls_key

networks:
  # No route out: PostgreSQL and the bundled S3 gateway are reachable from the app only.
  backend:
    internal: true
  # Needed to publish the app port on 127.0.0.1, and for an external S3.
  egress: {}

volumes:
  pgdata: {}
  s3data: {}
  # S3 Unix socket between s3-storage and s3 only. In memory, owned by UID 1000
  # (`seaweed` in SeaweedFS, `node` in the gateway).
  s3socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1000,gid=1000,mode=0700"
