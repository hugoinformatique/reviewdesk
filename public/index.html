<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReviewDesk — Admin</title><link rel="stylesheet" href="/admin.css"></head><body><main id="login" class="login"><form id="login-form"><div class="mark">R</div><h1>ReviewDesk</h1><p>Les retours de préproduction, au même endroit.</p><label>Identifiant<input name="username" value="admin" autocomplete="username"></label><label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label><button>Se connecter</button><output></output></form></main><div id="app" hidden><aside><div class="brand"><span>R</span> ReviewDesk</div><div class="aside-title">Projets</div><nav id="projects"></nav><button id="new-project" class="quiet">＋ Nouveau projet</button></aside><section class="workspace"><header><div><div class="eyebrow" id="client-label">TOUS LES CLIENTS</div><h1 id="project-title">Tous les retours</h1></div><div class="header-actions"><button id="review-link" class="quiet">Créer un lien reviewer</button><button id="logout" class="avatar">A</button></div></header><div class="toolbar"><select id="status"><option value="">Tous les statuts</option><option value="TODO">À traiter</option><option value="IN_PROGRESS">En cours</option><option value="REVIEW">À valider</option><option value="DONE">Traité</option></select><span id="count"></span></div><div class="content"><div id="tickets" class="tickets"></div><div id="detail" class="detail empty">Sélectionnez un retour</div></div></section></div><dialog id="project-dialog"><form id="project-form"><h2>Nouveau projet</h2><label>Nom<input name="name" placeholder="DEMO Site vitrine" required></label><label>Client<input name="clientLabel" placeholder="DEMO Client" required></label><label>Origines autorisées<input name="origins" placeholder="http://127.0.0.1:4310" required><small>Une origine par ligne, avec protocole.</small></label><div class="dialog-actions"><button type="button" class="quiet close">Annuler</button><button>Créer</button></div></form></dialog><dialog id="link-dialog"><h2>Lien reviewer créé</h2><p>Ce secret n’est affiché qu’une fois. Il reste dans le fragment URL et n’est pas envoyé dans les logs HTTP.</p><textarea id="link-output" readonly></textarea><button class="close">Fermer</button></dialog><script src="/admin.js"></script></body></html>
